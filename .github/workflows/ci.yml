name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: lint · tipos · arquitetura · testes · eval sem IA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm architecture
      - run: pnpm knip
      - run: pnpm test:coverage
      # Portão central: sem IA, nenhum caso pode falhar e nenhum erro grave é aceito.
      - run: pnpm eval:sem-ia
      - run: pnpm build

  eval-com-ia:
    name: eval com IA (custo e acerto reais)
    needs: qualidade
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'eval-ia')
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: eval
        run: pnpm eval --linha | tee eval.txt
      - name: resumo no PR
        run: |
          {
            echo '### Eval com IA'
            echo '```'
            cat eval.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
