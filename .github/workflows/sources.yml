name: official sources

# Todo dia confere se a Receita publicou versão nova do banco da Calculadora RTC.
# Se publicou, baixa a pasta nova, roda o eval contra ela e abre um PR com o diff.
# Nada entra na main sem o eval passar: tabela nova que quebra regra vira PR vermelho.

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        run: |
          if pnpm sources:check; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.new == 'true'
        run: pnpm sources:update && pnpm eval:sem-ia
      - if: steps.version.outputs.new == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sources/new-version
          title: 'chore(sources): nova versão da tabela oficial'
          commit-message: 'chore(sources): nova versão da tabela oficial'
          body: |
            A Calculadora RTC publicou uma versão nova do banco. Esta PR traz a pasta nova em `data/sources/` e o resultado do eval contra ela.
            Antes de aceitar: trocar `DEFAULT_TABLE` em `packages/sources/src/index.ts` e revisar o diff das classificações.
